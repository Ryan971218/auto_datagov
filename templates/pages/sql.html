            </div>

                  <span class="text-dim text-sm">·</span>
                  <span class="text-dim text-sm">database: yunhai_dw</span>
                </div>
                <div class="text-xs text-dim">
                  ⏱ 上次查询 5 分钟前
                </div>
              </div>
            </div>
            
            <!-- SQL 编辑器 -->
            <div class="card" style="padding: 0;">
              <div style="background: var(--bg); padding: 16px; border-radius: 8px 8px 0 0; border-bottom: 1px solid var(--border);">
                <pre style="margin: 0; padding: 16px; font-family: 'SF Mono', Monaco, monospace; font-size: 13px; line-height: 1.6; color: var(--text); overflow-x: auto;"><span style="color: var(--text);">-- GMV 月度对账 · 来自 AI 助手生成
-- 来源: concepts/gmv, sops/sop-gmv-001
WITH finance_gmv AS (
  SELECT
    DATE_TRUNC('month', order_date) AS month,
    SUM(paid_amount_cny) - SUM(refund_amount_cny) AS gmv
  FROM finance.dm_finance_gmv
  WHERE order_date >= DATE_TRUNC('month', CURRENT_DATE - INTERVAL '3 months')
  GROUP BY 1
),
warehouse_gmv AS (
  SELECT
    DATE_TRUNC('month', paid_at) AS month,
    SUM(paid_order_amount) - SUM(refund_amount) AS gmv
  FROM {{ ref('dm_finance_gmv') }}
  WHERE paid_at >= DATE_TRUNC('month', CURRENT_DATE - INTERVAL '3 months')
  GROUP BY 1
)
SELECT
  f.month,
  f.gmv AS finance_gmv,
  w.gmv AS warehouse_gmv,
  f.gmv - w.gmv AS diff,
  ROUND((f.gmv - w.gmv) * 100.0 / f.gmv, 2) AS diff_pct
FROM finance_gmv f
JOIN warehouse_gmv w USING (month)
WHERE ABS(f.gmv - w.gmv) > 100  -- 阈值 100 元
ORDER BY 1 DESC
LIMIT 10;</span></pre>
              </div>

            </div>

                  </tr>
                </thead>
