<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeanFlow · 含义流转平台</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface-2: #1c2128;
  --border: #30363d;
  --text: #c9d1d9;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --accent-2: #bc8cff;
  --success: #3fb950;
  --warning: #d29922;
  --danger: #f85149;
  --info: #39c5cf;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
}
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 240px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
}
.logo {
  padding: 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.logo-mark {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 18px; color: white;
}
.logo-name { font-weight: 600; font-size: 15px; }
.logo-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
nav { padding: 12px; flex: 1; overflow-y: auto; }
.nav-section {
  font-size: 11px; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.5px;
  padding: 8px 12px; margin-top: 12px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 6px;
  color: var(--text); cursor: pointer;
  text-decoration: none; margin-bottom: 2px;
  transition: background 0.15s;
}
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: rgba(88, 166, 255, 0.15); color: var(--accent); }
.nav-icon { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.sidebar-footer {
  padding: 16px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text-dim);
}
.main { flex: 1; min-width: 0; }
.topbar {
  height: 60px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 24px; gap: 16px;
}
.search { flex: 1; max-width: 480px; position: relative; }
.search input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 12px 8px 36px;
  color: var(--text); font-size: 13px;
}
.search input::placeholder { color: var(--text-dim); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 14px; }
.topbar-actions { margin-left: auto; display: flex; gap: 8px; }
.btn {
  background: var(--accent); color: white; border: none;
  padding: 8px 14px; border-radius: 6px;
  cursor: pointer; font-size: 13px; font-weight: 500;
}
.btn:hover { background: #4493f8; }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface-2); }
.content { padding: 32px; max-width: 1400px; }
.page { display: none; }
.page.active { display: block; }
.page-header { margin-bottom: 24px; }
.page-title { font-size: 24px; font-weight: 600; }
.page-subtitle { color: var(--text-dim); font-size: 14px; margin-top: 4px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 20px;
}
.card-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.grid { display: grid; gap: 16px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.metric { font-size: 28px; font-weight: 700; margin: 8px 0 4px; }
.metric-label { color: var(--text-dim); font-size: 12px; }
.metric-trend { font-size: 12px; margin-top: 4px; }
.metric-trend.up { color: var(--success); }
.metric-trend.down { color: var(--danger); }
.metric-trend.warn { color: var(--warning); }
.badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 12px;
  font-size: 11px; font-weight: 500;
}
.badge-success { background: rgba(63, 185, 80, 0.15); color: var(--success); }
.badge-warning { background: rgba(210, 153, 34, 0.15); color: var(--warning); }
.badge-danger { background: rgba(248, 81, 73, 0.15); color: var(--danger); }
.badge-info { background: rgba(57, 197, 207, 0.15); color: var(--info); }
.badge-accent { background: rgba(88, 166, 255, 0.15); color: var(--accent); }
.badge-purple { background: rgba(188, 140, 255, 0.15); color: var(--accent-2); }
.banner {
  background: linear-gradient(135deg, rgba(88, 166, 255, 0.1), rgba(188, 140, 255, 0.1));
  border: 1px solid rgba(88, 166, 255, 0.3);
  border-radius: 8px; padding: 16px 20px;
  margin-bottom: 24px; display: flex; gap: 12px;
}
.banner-icon { font-size: 20px; }
.banner-content { flex: 1; }
.banner-title { font-weight: 600; margin-bottom: 4px; }
.banner-text { font-size: 13px; color: var(--text-dim); }
.list-item {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; cursor: pointer;
}
.list-item:hover { background: var(--surface-2); }
.list-item:last-child { border-bottom: none; }
.list-item-icon {
  width: 32px; height: 32px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-2); font-size: 14px;
}
.list-item-main { flex: 1; min-width: 0; }
.list-item-title { font-weight: 500; }
.list-item-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.list-item-meta { display: flex; gap: 8px; align-items: center; }
.split { display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
.section { margin-bottom: 32px; }
.section-title {
  font-size: 13px; font-weight: 600; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;
}
.field {
  display: flex; gap: 12px; padding: 8px 0;
  border-bottom: 1px solid var(--border); font-size: 13px;
}
.field-label { color: var(--text-dim); min-width: 100px; }
.field-value { flex: 1; }
.timeline { border-left: 2px solid var(--border); padding-left: 16px; margin-left: 8px; }
.timeline-item { position: relative; padding-bottom: 16px; }
.timeline-item::before {
  content: ''; position: absolute; left: -22px; top: 6px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
}
.timeline-item.warning::before { background: var(--warning); }
.timeline-item.danger::before { background: var(--danger); }
.timeline-date { font-size: 11px; color: var(--text-dim); }
.timeline-title { font-weight: 500; margin-top: 2px; }
.timeline-desc { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab {
  padding: 8px 16px; cursor: pointer;
  border-bottom: 2px solid transparent;
  color: var(--text-dim); font-size: 13px;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab:hover { color: var(--text); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }
.scenario-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 20px;
  transition: border-color 0.15s;
}
.scenario-card:hover { border-color: var(--accent); }
.scenario-icon {
  width: 40px; height: 40px; border-radius: 8px;
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; margin-bottom: 12px;
}
.scenario-name { font-size: 16px; font-weight: 600; }
.scenario-desc { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.scenario-metrics {
  margin-top: 16px; padding-top: 16px;
  border-top: 1px solid var(--border);
}
.metric-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0; font-size: 13px;
}
.metric-name { color: var(--text-dim); }
.metric-current { font-weight: 500; }
.progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.progress-bar { height: 100%; background: var(--accent); border-radius: 2px; }
.note {
  background: rgba(88, 166, 255, 0.05);
  border-left: 3px solid var(--accent);
  padding: 12px 16px; border-radius: 4px;
  font-size: 13px; color: var(--text-dim);
  margin: 12px 0;
}
.note strong { color: var(--text); }
.health-bar {
  height: 24px; background: var(--surface-2);
  border-radius: 4px; overflow: hidden;
  position: relative; margin: 8px 0;
}
.health-segment { height: 100%; display: inline-block; }
.link { color: var(--accent); text-decoration: none; cursor: pointer; }
.link:hover { text-decoration: underline; }
.code {
  font-family: 'SF Mono', Monaco, Consolas, monospace;
  background: var(--bg); padding: 2px 6px;
  border-radius: 3px; font-size: 12px; color: var(--accent-2);
}
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.flex { display: flex; gap: 8px; align-items: center; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.text-dim { color: var(--text-dim); }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
ul { list-style: disc; }

/* 深度治理 - CSS-only tabs (零 JS) */
.depth-tab-radio { display: none !important; }
.depth-tab-labels {
  display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px;
}
.depth-tab-label {
  padding: 10px 20px; cursor: pointer; font-size: 14px;
  color: var(--text-dim); border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.depth-tab-label:hover { color: var(--text); }
.depth-tab-label-sm { padding: 6px 14px; font-size: 13px; }

#depth-tab-lineage:checked ~ .depth-tab-labels label[for="depth-tab-lineage"],
#lineage-table:checked ~ .depth-tab-labels label[for="lineage-table"] {
  color: var(--accent); border-bottom-color: var(--accent);
}
#depth-tab-quality:checked ~ .depth-tab-labels label[for="depth-tab-quality"],
#lineage-field:checked ~ .depth-tab-labels label[for="lineage-field"] {
  color: var(--accent); border-bottom-color: var(--accent);
}

.depth-panel { display: none; }
#lineage-table:checked ~ .depth-tab-content .lineage-table-panel,
#lineage-field:checked ~ .depth-tab-content .lineage-field-panel {
  display: block;
}
#depth-tab-lineage:checked ~ .depth-tab-content .lineage-panel,
#depth-tab-quality:checked ~ .depth-tab-content .quality-panel {
  display: block;
}
</style>


</head>
<body>

<div class="app">
  <aside class="sidebar"></aside>
  <main class="main" id="slot-pages"></main>
</div>

<!-- ============================================
     模块化模板（每个文件一个模块）
     templates/
       sidebar-header.html  ← logo
       sidebar-nav.html     ← 18 个导航项
       sidebar-footer.html  ← 底部信息
       pages/*.html         ← 18 个内容页
     ============================================ -->

<script src="app.js"></script>

</body>
</html>
